name: Sync Google Scholar

on:
  schedule:
    # One low-frequency profile request per month.
    - cron: "23 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Synchronize Scholar snapshot and homepage
        run: python scripts/sync_scholar.py

      - name: Verify generated files
        run: |
          python -m json.tool data/scholar.json >/dev/null
          test -s data/sync_report.md
          cmp cv/fbl_cv.pdf fbl_cv.pdf

      - name: Create review pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/scholar-sync
          delete-branch: true
          commit-message: "scholar: sync profile data"
          title: "Scholar: synchronize publication records"
          body: |
            Google Scholar is the upstream publication inventory for this update.

            This pull request:
            - refreshes `data/scholar.json` from the public author profile;
            - regenerates the homepage's recent-publications section;
            - updates `data/sync_report.md` with Scholar/CV differences.

            Before merging, review every Scholar-only and CV-only title. Scholar abbreviates authors and can merge publication versions, so the workflow does not rewrite the LaTeX CV automatically. If the CV needs changes, preserve full author names and venue qualifiers in `cv/fbl_cv.tex`, rebuild both PDF copies, and rerun `python scripts/sync_scholar.py`.
